plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mishrachemist.moltrixerp'
    compileSdk 34

    defaultConfig {
        applicationId "com.mishrachemist.moltrixerp"
        minSdk 26
        targetSdk 34
        // + 1000: the builds in the old repo went up to 34 - a lower number here would be a "downgrade" the phone refuses
        versionCode 1000 + Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "2." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        release {
            // the CI keeps the key in the ERP_APK_KEYSTORE secret (same key every build, so updates install over the old app)
            storeFile file(System.getenv("KS_FILE") ?: "release.jks")
            storePassword System.getenv("KS_PASS") ?: ""
            keyAlias "moltrix"
            keyPassword System.getenv("KS_PASS") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'   // to stop the WebView's "X-Requested-With: <app>" header
    implementation 'androidx.biometric:biometric:1.1.0'      // fingerprint lock of Moltrix (the phone's own prompt)
    implementation 'androidx.work:work-runtime:2.9.1'        // hourly check for the cloud sync's news (also with the app closed)
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.core:core:1.12.0'
}
