name: bullion page snapshot (temporary)
on: { pull_request: { paths: [".github/workflows/bullion-snap.yml"] } }
permissions: { contents: read }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - run: |
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=420,2300 --virtual-time-budget=8000 \
            --user-agent="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36" \
            --screenshot=/tmp/s.png https://bullions.co.in/ 2>/dev/null || true
          ls -la /tmp/s.png
          python3 -c "
          import base64;d=base64.b64encode(open('/tmp/s.png','rb').read()).decode()
          for i in range(0,len(d),4000): print('B64', i//4000, d[i:i+4000])
          print('B64END', len(d))"
