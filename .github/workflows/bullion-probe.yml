name: bullion page probe (temporary)
on: { pull_request: { paths: ["tools/bullion-probe.mjs", "tools/bullion-parse.mjs", ".github/workflows/bullion-probe.yml"] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/bullion-probe.mjs
