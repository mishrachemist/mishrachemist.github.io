# Moltrix - WhatsApp -> Excel sync in the cloud (runs even when the phone and the PC are off).
# Started every hour by a time trigger in the WA Inbox Google Apps Script (workflow_dispatch), because GitHub skips
# most scheduled runs; the hourly cron below is only a spare. Each start first checks the shared OneDrive state
# (wa_inbox_state.json); the real Fetch runs only when a fixed time (default: every hour) has passed and no
# device has fetched since then. When something was saved, a Web Push notification goes to the devices listed
# in push_config.json (OneDrive app folder; turned on in the app). The app itself (mishrachemist.github.io) does the work
# in a headless Chrome, so the parsing and Excel writing are exactly the same as on the phone.
# Needs the secrets MS_REFRESH_TOKEN (made by "Moltrix Microsoft login") and GH_PAT.
# This repo is public, so nothing from the messages is written to the log - only counts.
# Every run also saves the gold / silver rates (public bullion rates page) to bullion.json for the app's Market screen.
name: Moltrix WhatsApp sync

on:
  schedule:
    - cron: "41 * * * *"   # spare only - the Apps Script hourly trigger is the real clock
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch now (do not wait for the fixed time)"
        type: boolean
        default: false
      test_notify:
        description: "Only send a test notification to the Moltrix app (no fetch)"
        type: boolean
        default: false

permissions:
  contents: write     # only to put the encrypted news file for the Moltrix app on the release "moltrix-notify"

concurrency:
  group: moltrix-wa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WhatsApp -> Excel
        env:
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE: ${{ inputs.force }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: |
          mkdir -p /tmp/mx
          cat > /tmp/mx/run.mjs <<'EOF'
          import fs from "node:fs";
          import { execFileSync, execSync } from "node:child_process";
          import { createRequire } from "node:module";

          const CLIENT_ID = "0602bf34-628d-4364-97a9-ae6f0f2327ce";   // same Azure app as Moltrix
          const SCOPE = "offline_access https://graph.microsoft.com/Files.ReadWrite https://graph.microsoft.com/User.Read";
          const APP_URL = "https://mishrachemist.github.io/";
          const STATE_URL = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/wa_inbox_state.json:/content";
          const SLOTS_DEFAULT = "every hour", SLOTS_OLD = ["20:00,06:00,11:00", "04:00,12:00"];   // old saved defaults -> new default
          const force = process.env.FORCE === "true";
          const out = t => { console.log(t); if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, t + "\n\n"); };
          const fail = t => { out("❌ " + t); process.exit(1); };

          if (!process.env.MS_REFRESH_TOKEN) { out("Not set up yet - run the workflow \"Moltrix Microsoft login\" first."); process.exit(0); }
          if (!process.env.GH_PAT) fail("Secret GH_PAT is missing (needed to keep the Microsoft sign-in fresh).");

          // ---- Microsoft token (refresh token turns into a new one on every use; the new one is saved back) ----
          const r = await fetch("https://login.microsoftonline.com/common/oauth2/v2.0/token", {
            method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: "refresh_token", refresh_token: process.env.MS_REFRESH_TOKEN, scope: SCOPE })
          });
          const tk = await r.json().catch(() => ({}));
          if (!r.ok || !tk.access_token) fail(`Microsoft sign-in has expired or was refused (${tk.error || r.status}). Run "Moltrix Microsoft login" again.`);
          console.log("::add-mask::" + tk.access_token);
          if (tk.refresh_token) {
            console.log("::add-mask::" + tk.refresh_token);
            try {
              execFileSync("gh", ["secret", "set", "MS_REFRESH_TOKEN", "--repo", process.env.GITHUB_REPOSITORY],
                { input: tk.refresh_token, env: { ...process.env, GH_TOKEN: process.env.GH_PAT }, stdio: ["pipe", "ignore", "pipe"] });
            } catch (e) { fail("Could not save the fresh Microsoft sign-in (check that GH_PAT has Secrets: Read and write, and has not expired)."); }
          }
          const token = tk.access_token, exp = Date.now() + (Number(tk.expires_in) || 3600) * 1000;
          const g = async url => { const x = await fetch(url, { headers: { Authorization: "Bearer " + token }, cache: "no-store" }); return x; };

          const me = await (await g("https://graph.microsoft.com/v1.0/me?$select=userPrincipalName,mail")).json().catch(() => ({}));
          const email = String(me.userPrincipalName || me.mail || "").toLowerCase();
          if (!email) fail("Could not read the signed-in Microsoft account.");
          console.log("::add-mask::" + email);

          // ---- test notification for the Moltrix app only (Run workflow → "test_notify") ----
          if (process.env.TEST_NOTIFY === "true") {
            const pr = await g("https://graph.microsoft.com/v1.0/me/drive/special/approot:/push_config.json:/content?t=" + Date.now());
            const cfg = pr.ok ? await pr.json().catch(() => ({})) : {};
            if (!cfg || !cfg.app || !cfg.app.key) { out("🔕 The Moltrix app has not turned notifications on yet (no app key in push_config.json)."); process.exit(0); }
            const { createCipheriv, randomBytes } = await import("node:crypto");
            const iv = randomBytes(12), c = createCipheriv("aes-256-gcm", Buffer.from(cfg.app.key, "base64"), iv);
            const t = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" });
            const enc = Buffer.concat([c.update(JSON.stringify({ id: Date.now(), title: "Moltrix - test", body: `Notifications work (sent ${t})` }), "utf8"), c.final(), c.getAuthTag()]);
            fs.writeFileSync("/tmp/moltrix-news.bin", Buffer.concat([iv, enc]).toString("base64"));
            out("📱 Test news for the Moltrix app made (key set " + (cfg.app.at || "?") + ").");
            process.exit(0);
          }

          // ---- gold / silver rates -> OneDrive app folder bullion.json (every run; the app's Market screen reads it) ----
          await (async () => {
            try {
              const BURL = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/bullion.json:/content";
              const hr = await fetch("https://bullions.co.in/", { headers: { "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36", "Accept-Language": "en-IN,en;q=0.9" } });
              if (!hr.ok) throw new Error("page " + hr.status);
              const html = await hr.text();
              const txt = html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ")
                .replace(/&#x20B9;|&#8377;/gi, "₹").replace(/&#x24;/gi, "$").replace(/&amp;/g, "&").replace(/&nbsp;/g, " ").replace(/&#0?39;|&#x27;/g, "'")
                .replace(/\s+/g, " ");
              const num = v => Number(String(v).replace(/,/g, ""));
              const N6 = "([\\d,]+(?:\\.\\d+)?) ([\\d,]+(?:\\.\\d+)?) ([\\d,]+(?:\\.\\d+)?) ([\\d,]+(?:\\.\\d+)?) ([\\d,]+(?:\\.\\d+)?) ([\\d,]+(?:\\.\\d+)?)";
              const units = m => ({ g1: num(m[1]), g10: num(m[2]), g100: num(m[3]), kg: num(m[4]), oz: num(m[5]), tola: num(m[6]) });
              const gold = [...txt.matchAll(new RegExp("Gold (\\d{1,2}) Karat \\(Rs ₹\\) " + N6, "g"))].map(m => Object.assign({ k: +m[1] }, units(m.slice(1))));
              const silver = [...txt.matchAll(new RegExp("Silver (\\d{3}) (\\w+) \\(Rs ₹\\) " + N6, "g"))].map(m => Object.assign({ p: +m[1], name: m[2] }, units(m.slice(2))));
              if (!gold.length || !silver.length || !gold.some(x => x.k === 24)) throw new Error("rates not found on the page");
              const upd = (/Gold Rate Today in India Last Update : (\w+, \d{1,2} \w{3} \d{4} \d{1,2}:\d{2} [AP]M)/.exec(txt) || [])[1] || "";
              const sUpd = (/Silver Rate Today in India Last Update : (\w+, \d{1,2} \w{3} \d{4} \d{1,2}:\d{2} [AP]M)/.exec(txt) || [])[1] || upd;
              const head = k => { const m = new RegExp(k + " ([\\d,]+\\.\\d+) ([+-][\\d,]+\\.\\d+) \\(([+-][\\d.]+)%\\)").exec(txt); return m ? { price: num(m[1]), chg: num(m[2]), pct: +m[3] } : null; };
              const dm = /1 Day Ago (\d{4}-\d\d-\d\d) 1 Week Ago (\d{4}-\d\d-\d\d) 1 Month Ago (\d{4}-\d\d-\d\d) 1 Year Ago (\d{4}-\d\d-\d\d)/.exec(txt);
              const chRow = re => { const m = re.exec(txt); return m ? [0, 1, 2, 3].map(i => ({ price: num(m[1 + 2 * i]), pct: +m[2 + 2 * i] })) : null; };
              const P4 = " ([\\d,]+\\.\\d+) ([+-]?[\\d.]+)% ([\\d,]+\\.\\d+) ([+-]?[\\d.]+)% ([\\d,]+\\.\\d+) ([+-]?[\\d.]+)% ([\\d,]+\\.\\d+) ([+-]?[\\d.]+)%";
              const live = [["Gold - India MCX", "₹/10 g"], ["Silver - India MCX", "₹/kg"], ["Gold - US Comex", "$/oz"], ["Silver - US Comex", "$/oz"]].map(([n, u]) => {
                const m = new RegExp(n.replace(/ /g, "\\s") + " \\([^)]*\\) ([\\d,]+\\.\\d+) ([+-]?[\\d,]+\\.\\d+) ([+-]?[\\d.]+)% ([\\d,]+\\.\\d+) ([\\d,]+\\.\\d+) ([\\d,]+\\.\\d+) (\\d{1,2} \\w{3}, \\d{1,2}:\\d{2})").exec(txt);
                return m ? { name: n.replace(" - ", " · "), unit: u, price: num(m[1]), chg: num(m[2]), pct: +m[3], high: num(m[4]), low: num(m[5]), prev: num(m[6]), time: m[7] } : null;
              }).filter(Boolean);
              const newsSeg = (txt.split("publish their rates once or more during the day")[1] || "").split("Copyright")[0];
              const news = [...newsSeg.matchAll(/([A-Z][^]{10,140}?) In News (\w{3}, \w{3} \d{1,2} \d{4})/g)].map(m => ({ t: m[1].replace(/^.*?News\s+/, "").trim(), d: m[2] })).slice(0, 8);
              const hist = id => { const m = new RegExp("var " + id + "=\\[([\\s\\S]*?)\\];").exec(html); return m ? [...m[1].matchAll(/date: '(\d{4}-\d\d-\d\d)', value:([\d.]+)/g)].map(x => [x[1], +x[2]]) : []; };
              const data = { v: 1, fetchedAt: new Date().toISOString(), updated: upd, silverUpdated: sUpd,
                head: { gold: head("GOLD"), silver: head("SILVER") }, gold, silver,
                change: dm ? { dates: dm.slice(1, 5), gold: chRow(new RegExp("Gold 24 Karat \\( Rs ₹ /10gm\\)" + P4)), silver: chRow(new RegExp("Silver 999 \\(Rs ₹/1kg\\)" + P4)) } : null,
                live, news, hist: { gold: hist("chartData1"), silver: hist("chartData2") } };
              const up = await fetch(BURL, { method: "PUT", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(data) });
              if (!up.ok) throw new Error("OneDrive " + up.status);
              console.log(`Bullion rates saved (${upd || "time n/a"}; ${gold.length} gold, ${silver.length} silver rows, ${live.length} live, ${data.hist.gold.length}/${data.hist.silver.length} chart days, ${news.length} news).`);
            } catch (e) { console.log("Bullion rates not updated: " + e.message); }
          })();

          // ---- due? (same rule as the app: a fixed time has passed since the last fetch on any device) ----
          const sr = await g(STATE_URL + "?t=" + Date.now());
          if (sr.status === 404) fail("wa_inbox_state.json not found in this account's OneDrive - sign in (Moltrix Microsoft login) with the main account that the app uses.");
          if (!sr.ok) fail("Could not read the WhatsApp state from OneDrive (" + sr.status + ").");
          const keys = ((await sr.json().catch(() => ({}))) || {}).keys || {};
          if (!keys.waInboxUrl || !keys.waInboxToken) fail("WhatsApp Inbox URL / TOKEN are not saved in the app (⚙️ Inbox Settings).");
          const parse = txt => { if (/^\s*(every\s*hour|hourly)\s*$/i.test(String(txt || ""))) return Array.from({ length: 24 }, (_, h) => [h, 0]); const o = []; for (const p of String(txt || "").split(/[,;\s]+/).filter(Boolean)) { const m = /^(\d{1,2})(?:[:.](\d{2}))?$/.exec(p); if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return null; o.push([+m[1], +(m[2] || 0)]); } return o; };
          const key = x => (parse(x) || []).map(v => v[0] * 60 + v[1]).sort((p, q) => p - q).join(",");
          const saved = SLOTS_OLD.some(o => key(keys.waSlots || "") === key(o)) ? "" : keys.waSlots;
          const slots = parse(saved || SLOTS_DEFAULT) || parse(SLOTS_DEFAULT);
          const now = Date.now();
          let lastSlot = 0;
          slots.forEach(v => { const d = new Date(now); d.setHours(v[0], v[1], 0, 0); let t = d.getTime(); if (t > now) t -= 86400000; if (t > lastSlot) lastSlot = t; });
          const lastAt = parseInt(keys.waInboxLastAt || "0", 10) || 0;
          const fmt = t => t ? new Date(t).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }) : "never";
          if (!force && !(lastSlot > lastAt)) { console.log(`Not due - last fetch ${fmt(lastAt)}, last fixed time ${fmt(lastSlot)}.`); process.exit(0); }
          out(`Due - fixed time ${fmt(lastSlot)}, last fetch ${fmt(lastAt)}${force ? " (forced)" : ""}.`);

          // ---- run the app's own Fetch in headless Chrome ----
          execSync("npm install --prefix /tmp/mx --no-audit --no-fund --silent playwright-core@1 web-push@3", { stdio: "ignore" });
          const { chromium } = createRequire("/tmp/mx/")("playwright-core");
          const exe = ["/usr/bin/google-chrome", "/usr/bin/google-chrome-stable", "/usr/bin/chromium"].find(p => fs.existsSync(p));
          if (!exe) fail("Chrome not found on the runner.");
          const browser = await chromium.launch({ executablePath: exe, headless: true });
          try {
            const ctx = await browser.newContext({ timezoneId: "Asia/Kolkata", locale: "en-IN", serviceWorkers: "block", viewport: { width: 1280, height: 900 } });
            await ctx.addInitScript(em => {
              try {
                localStorage.setItem("roleCache:" + em, JSON.stringify({ r: "owner", t: Date.now() }));
                localStorage.setItem("ownerCfg", JSON.stringify({ owners: [em], viewers: [], revoke: [] }));
                localStorage.setItem("waSlotOn", "0");   // the page's own 1-minute auto-fetch stays off; this script decides
              } catch (e) {}
            }, email);
            const page = await ctx.newPage();
            let dialogs = 0, pageErrors = 0;
            page.on("dialog", d => { dialogs++; d.dismiss().catch(() => {}); });
            page.on("pageerror", () => { pageErrors++; });
            await page.goto(APP_URL, { waitUntil: "load", timeout: 120000 });
            await page.waitForFunction(() => typeof waInboxFetch === "function" && typeof waCloudPull === "function" && typeof msalReady !== "undefined", null, { timeout: 120000 });
            const res = await page.evaluate(async ({ email, token, exp, force }) => {
              await msalReady;
              account = { username: email, homeAccountId: "cloud-runner", localAccountId: "cloud-runner", idTokenClaims: { preferred_username: email } };
              cachedAccessToken = token; cachedTokenExpiry = exp;
              getToken = async () => token;            // the app's Microsoft token comes from this runner
              waDeviceLabel = () => "Cloud";           // shown in the app as "(Cloud)" after the last fetch
              if (!waSyncEnabled()) return { err: "owner check failed in the app" };
              const pull = await waCloudPull();
              const c = waInboxCfg();
              if (!c.url || !c.token) return { err: "WhatsApp Inbox not set up in the app" };
              if (!force && !(waLastSlotTime() > waAutoLastAt())) return { skipped: true };
              waAutoRun = true;
              try { await waInboxFetch(); } finally { waAutoRun = false; }
              await waCloudPush();
              const st = document.getElementById("status");
              let retry = 0; try { retry = (JSON.parse(localStorage.getItem("waInboxRetry") || "[]") || []).length; } catch (e) {}
              const lines = String(st ? st.textContent : "").split("\n").map(x => x.trim()).filter(Boolean);
              return { pull, cls: st ? st.className : "", first: (lines[0] || "").slice(0, 160), detail: lines.slice(1, 9).join("\n").slice(0, 600),
                       rowFrom: c.lastRow, rowTo: waInboxCfg().lastRow, retry };
            }, { email, token, exp, force });
            if (res.err) fail(res.err);
            if (res.skipped) { out("Another device fetched just now - nothing to do."); }
            else {
              out(`${res.cls === "err" ? "⚠️" : "✅"} ${res.first}`);
              out(`Inbox rows ${res.rowFrom} → ${res.rowTo}${res.retry ? ` · 🔁 ${res.retry} waiting for retry` : ""}${dialogs ? ` · ${dialogs} pop-up(s) closed` : ""}${pageErrors ? ` · ${pageErrors} page error(s)` : ""}`);
              // ---- phone notification when something was saved (or failed) ----
              const n = k => { const m = new RegExp("(\\d+) " + k).exec(res.first); return m ? +m[1] : 0; };
              const worth = n("saved") + n("failed") + n("consumption") + n("RHF transfer") > 0 || res.cls === "err";
              if (worth) {
                try {
                  const pr = await g("https://graph.microsoft.com/v1.0/me/drive/special/approot:/push_config.json:/content?t=" + Date.now());
                  const cfg = pr.ok ? await pr.json().catch(() => ({})) : {};
                  // the Moltrix Android app shows its own notification: no Chrome (Android browser) notification as well
                  const subs = ((cfg && cfg.subs) || []).filter(x => !(cfg.app && cfg.app.key && x && x.device === "Android"));
                  const news = { title: (res.cls === "err" ? "⚠️ " : "") + "Moltrix - WhatsApp sync", body: res.first.replace(/^WhatsApp fetch: /, "") + (res.detail ? "\n" + res.detail : "") };
                  // Moltrix Android app (own WebView, no Chrome): it checks every hour for this file - encrypted with the key in
                  // push_config.json (AES-256-GCM), so the copy on GitHub can't be read by anyone else; the next step uploads it
                  if (cfg && cfg.app && cfg.app.key) {
                    try {
                      const { createCipheriv, randomBytes } = await import("node:crypto");
                      const { writeFileSync } = await import("node:fs");
                      const iv = randomBytes(12), c = createCipheriv("aes-256-gcm", Buffer.from(cfg.app.key, "base64"), iv);
                      const enc = Buffer.concat([c.update(JSON.stringify(Object.assign({ id: Date.now() }, news)), "utf8"), c.final(), c.getAuthTag()]);
                      writeFileSync("/tmp/moltrix-news.bin", Buffer.concat([iv, enc]).toString("base64"));
                      out("📱 News for the Moltrix app made.");
                    } catch (e) { out("⚠️ News for the Moltrix app not made: " + e.message); }
                  }
                  if (!cfg.vapid || !subs.length) console.log("🔕 No browser has notifications turned on.");
                  else {
                    const webpush = createRequire("/tmp/mx/")("web-push");
                    webpush.setVapidDetails(cfg.vapid.subject || APP_URL, cfg.vapid.publicKey, cfg.vapid.privateKey);
                    const payload = JSON.stringify(Object.assign({ tag: "moltrix-sync", url: APP_URL }, news));
                    let sent = 0; const gone = [];
                    for (const s of subs) {
                      try { await webpush.sendNotification({ endpoint: s.endpoint, keys: s.keys }, payload, { TTL: 6 * 3600 }); sent++; }
                      catch (e) { if (e && (e.statusCode === 404 || e.statusCode === 410)) gone.push(s.endpoint); else console.log("Push to one device failed (" + (e && e.statusCode || "error") + ")."); }
                    }
                    if (gone.length) {
                      cfg.subs = subs.filter(s => !gone.includes(s.endpoint));
                      await fetch("https://graph.microsoft.com/v1.0/me/drive/special/approot:/push_config.json:/content", { method: "PUT", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
                    }
                    out(`🔔 Notification sent to ${sent} device(s)${gone.length ? ` · ${gone.length} old one(s) removed` : ""}.`);
                  }
                } catch (e) { out("⚠️ Notification could not be sent."); }
              }
            }
          } finally { await browser.close(); }
          EOF
          node /tmp/mx/run.mjs

      - name: News for the Moltrix app
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/moltrix-news.bin ] || { echo "Nothing new."; exit 0; }
          cp /tmp/moltrix-news.bin n.bin
          gh release view moltrix-notify --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create moltrix-notify --repo "$GITHUB_REPOSITORY" --title "Moltrix app news (encrypted)" --notes "Read by the Moltrix Android app every hour. Encrypted - not readable without the app's key." --latest=false
          gh release upload moltrix-notify n.bin --clobber --repo "$GITHUB_REPOSITORY"
          echo "📱 News put for the Moltrix app."
