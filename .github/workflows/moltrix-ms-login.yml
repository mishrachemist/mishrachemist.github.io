# Moltrix - one-time Microsoft sign-in for the cloud WhatsApp sync.
# Run it (Actions -> Moltrix Microsoft login -> Run workflow), open the job log, then on any phone/PC open
# https://microsoft.com/devicelogin and type the code shown in the log. Sign in with the MAIN Moltrix account
# (the one whose OneDrive has the Reports files). The sign-in is saved as the secret MS_REFRESH_TOKEN.
# Needs: Azure app -> Authentication -> "Allow public client flows" = Yes, and the secret GH_PAT.
name: Moltrix Microsoft login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign in (code in this log)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cat > /tmp/login.mjs <<'EOF'
          import { execFileSync } from "node:child_process";
          const CLIENT_ID = "0602bf34-628d-4364-97a9-ae6f0f2327ce";
          const SCOPE = "offline_access https://graph.microsoft.com/Files.ReadWrite https://graph.microsoft.com/User.Read";
          const fail = t => { console.log("❌ " + t); process.exit(1); };
          if (!process.env.GH_PAT) fail("Secret GH_PAT is missing - add it first (Settings -> Secrets and variables -> Actions).");
          const post = async (url, body) => { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(body) }); return { ok: r.ok, j: await r.json().catch(() => ({})) }; };
          const dc = await post("https://login.microsoftonline.com/common/oauth2/v2.0/devicecode", { client_id: CLIENT_ID, scope: SCOPE });
          if (!dc.ok || !dc.j.device_code) fail(`Microsoft refused (${dc.j.error || "error"}). In Azure: App registrations -> this app -> Authentication -> "Allow public client flows" = Yes -> Save.`);
          console.log("\n==================================================");
          console.log(`  Open:  ${dc.j.verification_uri}`);
          console.log(`  Code:  ${dc.j.user_code}`);
          console.log("  Sign in with the main Moltrix account.");
          console.log("==================================================\n");
          let wait = (dc.j.interval || 5) * 1000;
          const until = Date.now() + (dc.j.expires_in || 900) * 1000;
          let tk = null;
          while (Date.now() < until) {
            await new Promise(res => setTimeout(res, wait));
            const t = await post("https://login.microsoftonline.com/common/oauth2/v2.0/token", { grant_type: "urn:ietf:params:oauth:grant-type:device_code", client_id: CLIENT_ID, device_code: dc.j.device_code });
            if (t.ok && t.j.refresh_token) { tk = t.j; break; }
            if (t.j.error === "authorization_pending") continue;
            if (t.j.error === "slow_down") { wait += 5000; continue; }
            fail(`Sign-in did not finish (${t.j.error || "error"}${t.j.error_codes ? " " + t.j.error_codes.join(",") : ""}).`);
          }
          if (!tk) fail("Time over - run the workflow again and enter the code within 15 minutes.");
          console.log("::add-mask::" + tk.access_token);
          console.log("::add-mask::" + tk.refresh_token);
          const s = await fetch("https://graph.microsoft.com/v1.0/me/drive/special/approot:/wa_inbox_state.json:/content", { headers: { Authorization: "Bearer " + tk.access_token } });
          if (s.status === 404) fail("This account has no Moltrix WhatsApp state in its OneDrive - run again and sign in with the main Moltrix account.");
          if (!s.ok) fail("Signed in, but OneDrive could not be read (" + s.status + ").");
          try {
            execFileSync("gh", ["secret", "set", "MS_REFRESH_TOKEN", "--repo", process.env.GITHUB_REPOSITORY],
              { input: tk.refresh_token, env: { ...process.env, GH_TOKEN: process.env.GH_PAT }, stdio: ["pipe", "ignore", "pipe"] });
          } catch (e) { fail("Signed in, but the secret could not be saved - GH_PAT needs Secrets: Read and write for this repository."); }
          console.log("✅ Signed in and saved. The cloud WhatsApp sync is ready.");
          EOF
          node /tmp/login.mjs
